name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install --yes subversion
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install WordPress test library
        run: bash scripts/install-wp-tests-ci.sh wordpress_test root root 127.0.0.1 7.1
      - run: vendor/bin/phpunit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          OPACE_ESEOT_PLUGIN_FILE: ${{ github.workspace }}/opace-essential-seo-toolkit.php

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opace-essential-seo-toolkit-2.0.0
          path: release/opace-essential-seo-toolkit-2.0.0.zip

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-release.sh
      - run: bash scripts/plugin-check-standalone.sh

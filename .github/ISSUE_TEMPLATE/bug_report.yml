name: Bug report
description: Report a reproducible plugin problem without private content
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Plugin, WordPress and PHP versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not include private URLs, draft content, credentials or customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true

